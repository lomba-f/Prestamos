name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Crear proyecto Android
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          cat > settings.gradle <<'E'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Prestamos"
          include ':app'
          E
          cat > build.gradle <<'E'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          E
          cat > gradle.properties <<'E'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          E
          mkdir -p app
          cat > app/build.gradle <<'E'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.prestamos.app'
              compileSdk 34
              defaultConfig { applicationId 'com.prestamos.app'; minSdk 29; targetSdk 34; versionCode 1; versionName '1.0' }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          E
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'E'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="Mis Préstamos" android:allowBackup="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          E
          mkdir -p app/src/main/java/com/prestamos/app
          cat > app/src/main/java/com/prestamos/app/MainActivity.java <<'E'
          package com.prestamos.app;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import java.io.OutputStream;

          public class MainActivity extends Activity {
              WebView web;

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  web.setWebViewClient(new WebViewClient());
                  web.addJavascriptInterface(new Object() {
                      @JavascriptInterface public void savePdf(final String name, String b64) {
                          try {
                              byte[] d = Base64.decode(b64, Base64.DEFAULT);
                              ContentValues v = new ContentValues();
                              v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                              v.put(MediaStore.Downloads.MIME_TYPE, "application/pdf");
                              final Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                              OutputStream o = getContentResolver().openOutputStream(u);
                              o.write(d); o.close();
                              runOnUiThread(new Runnable() { public void run() {
                                  Toast.makeText(MainActivity.this, "PDF guardado en Descargas", Toast.LENGTH_LONG).show();
                                  Intent i = new Intent(Intent.ACTION_VIEW);
                                  i.setDataAndType(u, "application/pdf");
                                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                                  try { startActivity(Intent.createChooser(i, name)); } catch (Exception e) {}
                              }});
                          } catch (Exception e) {
                              runOnUiThread(new Runnable() { public void run() {
                                  Toast.makeText(MainActivity.this, "No se pudo guardar el PDF", Toast.LENGTH_LONG).show();
                              }});
                          }
                      }
                  }, "Android");
                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }
          }
          E
      - name: Icono
        run: |
          mkdir -p app/src/main/res/drawable
          cp icon.jpg app/src/main/res/drawable/icon.jpg
          sed -i 's|<application |<application android:icon="@drawable/icon" |' app/src/main/AndroidManifest.xml
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: MisPrestamos-apk, path: app/build/outputs/apk/debug/app-debug.apk }
